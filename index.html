<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SatuAlbum • Runway Wedding Organizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-secondary: #111726;
      --bg-card: rgba(21, 27, 38, 0.88);
      --accent-neon: #00ffaa;
      --accent-gold: #f5c542;
      --accent-danger: #ff5252;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-glass: rgba(0, 255, 170, 0.22);
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-main);
      background-image: radial-gradient(circle at 15% 15%, rgba(0, 255, 170, 0.07) 0%, transparent 35%),
                        radial-gradient(circle at 85% 80%, rgba(245, 197, 66, 0.05) 0%, transparent 35%);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 105px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Glassmorphism Cards */
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
    }

    /* Top Navigation Bar */
    .top-nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(11, 15, 25, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-glass);
      padding
